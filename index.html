<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Airport Control</title>
  <style>
    :root {
      --bg1: #8ecae6;
      --bg2: #90be6d;
      --panel: rgba(16, 28, 46, 0.7);
      --panel2: rgba(18, 40, 62, 0.8);
      --text: #ecf8ff;
      --accent: #ffd166;
      --green: #7ae582;
      --red: #ff6b6b;
      --yellow: #ffe66d;
      --runway: #424b54;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(var(--bg1), var(--bg2));
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      touch-action: manipulation;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(#7ec8ff 0%, #bfe8ff 45%, #95d28b 46%, #8bc86e 100%);
    }

    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: var(--panel);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 10px 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      font-weight: bold;
      line-height: 1.4;
      z-index: 2;
    }

    .hud .label {
      font-size: 12px;
      opacity: 0.8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hud .value {
      font-size: 24px;
      margin-top: 2px;
    }

    .controls {
      position: absolute;
      right: 18px;
      bottom: 18px;
      background: var(--panel2);
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.12);
      padding: 12px 14px;
      z-index: 2;
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      max-width: 250px;
    }

    .controls h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--yellow);
    }

    .controls p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      opacity: 0.9;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 12, 18, 0.38);
      z-index: 3;
    }

    .card {
      text-align: center;
      background: rgba(13, 27, 42, 0.85);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 26px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      max-width: 420px;
    }

    .card h1 {
      margin: 0 0 10px 0;
      font-size: clamp(28px, 4vw, 42px);
      color: var(--accent);
    }

    .card p {
      margin: 0 0 18px 0;
      line-height: 1.6;
      font-size: 16px;
      opacity: 0.9;
    }

    button {
      border: none;
      background: linear-gradient(135deg, #ffd166, #ffb703);
      color: #1d1d1d;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      padding: 14px 22px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(255,179,1,0.4);
      transition: transform 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
      <div class="label">Landing</div>
      <div class="value" id="landings">0</div>
    </div>

    <div class="controls">
      <h3>How to play</h3>
      <p>
        Tap or click a plane to guide it in for landing.<br>
        Keep the airport efficient and avoid crashes.
      </p>
    </div>

    <div id="startOverlay" class="overlay">
      <div class="card">
        <h1>Airport Control</h1>
        <p>
          Manage incoming planes, land them safely, and build up your score.
          The airport gets busier over time.
        </p>
        <button id="startBtn">Start Game</button>
      </div>
    </div>

    <canvas id="canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const landingsEl = document.getElementById("landings");
    const startBtn = document.getElementById("startBtn");
    const startOverlay = document.getElementById("startOverlay");

    let width = 0;
    let height = 0;
    let lastTime = 0;
    let gameStarted = false;
    let spawnTimer = 0;
    let planeIdCounter = 0;

    const skyColors = ["#75c7ff", "#7ec8ff", "#88d2ff"];
    let state = {
      score: 0,
      best: Number(localStorage.getItem("airportBest") || 0),
      landings: 0,
      planes: [],
      runway: {
        x: 0,
        y: 0,
        width: 0,
        length: 0
      }
    };

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

      state.runway.y = height * 0.82;
      state.runway.width = Math.min(width * 0.32, 300);
      state.runway.length = Math.max(120, height * 0.22);
      state.runway.x = (width - state.runway.width) / 2;
    }

    function resetGame() {
      state.score = 0;
      state.landings = 0;
      state.planes = [];
      spawnTimer = 0;
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = String(state.score);
      bestEl.textContent = String(state.best);
      landingsEl.textContent = String(state.landings);
    }

    function addPlane() {
      const direction = Math.random() < 0.5 ? "left" : "right";
      const speed = 0.9 + Math.random() * 0.8 + state.score * 0.015;

      const plane = {
        id: ++planeIdCounter,
        x: direction === "left" ? -50 : width + 50,
        y: 80 + Math.random() * (height * 0.35),
        vx: direction === "left" ? speed : -speed,
        vy: 0.8 + Math.random() * 0.8,
        w: 30,
        h: 18,
        landed: false,
        crashed: false,
        phase: "approach",
        selected: false,
        direction,
        fuel: 100
      };

      state.planes.push(plane);
    }

    function planeHasReachedRunway(plane) {
      const runwayCenterX = state.runway.x + state.runway.width / 2;
      const runwayTop = state.runway.y;
      const runwayBottom = state.runway.y + state.runway.length;

      const isNearCenter = Math.abs(plane.x - runwayCenterX) < 18;
      const isOnRunwayHeight = plane.y >= runwayTop - 5 && plane.y <= runwayBottom + 10;

      return isNearCenter && isOnRunwayHeight;
    }

    function finishLanding(plane) {
      plane.landed = true;
      plane.phase = "landed";
      state.score += 10;
      state.landings += 1;
      if (state.score > state.best) {
        state.best = state.score;
        localStorage.setItem("airportBest", String(state.best));
      }
      updateHud();
    }

    function crashPlane(plane) {
      plane.crashed = true;
      plane.phase = "crashed";
      state.score = Math.max(0, state.score - 15);
      updateHud();
    }

    function updatePlanes(dt) {
      const runwayCenterX = state.runway.x + state.runway.width / 2;

      for (let i = state.planes.length - 1; i >= 0; i--) {
        const p = state.planes[i];

        if (p.crashed || p.landed) {
          state.planes.splice(i, 1);
          continue;
        }

        p.fuel -= dt * 0.6;

        if (p.selected) {
          const targetX = runwayCenterX;
          const targetY = state.runway.y - 12;
          const dx = targetX - p.x;
          const dy = targetY - p.y;

          p.x += dx * 0.02;
          p.y += dy * 0.02;
          p.y += 0.3;
        } else {
          p.x += p.vx * dt * 60;
          p.y += p.vy * dt * 60;

          if (p.direction === "left") {
            if (p.x > width + 80) {
              state.planes.splice(i, 1);
              continue;
            }
          } else {
            if (p.x < -80) {
              state.planes.splice(i, 1);
              continue;
            }
          }

          if (p.y > height * 0.6) {
            p.vy *= 0.96;
          }

          if (p.y > height * 0.8) {
            p.vy = -Math.abs(p.vy) * 0.7;
          }

          if (p.fuel <= 0) {
            crashPlane(p);
            continue;
          }
        }

        if (planeHasReachedRunway(p)) {
          finishLanding(p);
          continue;
        }

        if (p.y > state.runway.y + state.runway.length + 50 && p.selected === false) {
          crashPlane(p);
          continue;
        }
      }
    }

    function spawnPlanes(dt) {
      spawnTimer -= dt;
      const spawnRate = Math.max(0.7, 2.2 - state.score * 0.02);
      if (spawnTimer <= 0) {
        addPlane();
        spawnTimer = spawnRate;
      }
    }

    function renderRunway() {
      ctx.fillStyle = "#4b4f52";
      ctx.fillRect(state.runway.x, state.runway.y, state.runway.width, state.runway.length);

      ctx.fillStyle = "#dfe6eb";
      for (let i = 0; i < 12; i++) {
        const x = state.runway.x + 28 + i * 20;
        ctx.fillRect(x, state.runway.y + 18, 12, 8);
      }

      ctx.strokeStyle = "rgba(255,255,255,0.8)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(state.runway.x + state.runway.width / 2, state.runway.y);
      ctx.lineTo(state.runway.x + state.runway.width / 2, state.runway.y + state.runway.length);
      ctx.stroke();

      ctx.fillStyle = "#dfe9f1";
      ctx.fillRect(width * 0.5 - 90, height * 0.68, 180, 80);
      ctx.fillStyle = "#71b8ff";
      ctx.fillRect(width * 0.5 - 70, height * 0.7, 140, 24);

      ctx.fillStyle = "#7dbb67";
      ctx.fillRect(0, height * 0.76, width, height * 0.3);
    }

    function drawPlane(p) {
      const x = p.x;
      const y = p.y;

      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = p.selected ? "#ffb703" : "#f4f7fb";
      ctx.fillRect(-18, -10, 36, 20);

      ctx.fillStyle = "#dfeaf0";
      ctx.fillRect(-6, -18, 12, 8);
      ctx.fillRect(-6, 12, 12, 8);

      ctx.fillStyle = "#c7d4df";
      ctx.fillRect(18, -4, 10, 8);
      ctx.fillRect(-26, -4, 8, 8);

      ctx.fillStyle = "#2d4059";
      for (let i = -12; i < 14; i += 8) {
        ctx.fillRect(i, -6, 5, 5);
      }

      if (p.selected) {
        ctx.strokeStyle = "#ffec99";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.fillRect(-22, -24, 44, 6);
      ctx.fillStyle = p.fuel > 40 ? "#7ae582" : "#ff6b6b";
      ctx.fillRect(-22, -24, (p.fuel / 100) * 44, 6);

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      const sky = ctx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, skyColors[0]);
      sky.addColorStop(0.4, skyColors[1]);
      sky.addColorStop(0.5, "#bfe8ff");
      sky.addColorStop(1, "#8ec69b");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < 10; i++) {
        const cx = (i * 180 + (performance.now() * 0.02) % 1000) % (width + 200) - 100;
        const cy = 60 + (i % 4) * 70;
        ctx.fillStyle = "rgba(255,255,255,0.65)";
        ctx.beginPath();
        ctx.arc(cx, cy, 22, 0, Math.PI * 2);
        ctx.arc(cx + 22, cy - 5, 18, 0, Math.PI * 2);
        ctx.arc(cx - 18, cy - 4, 16, 0, Math.PI * 2);
        ctx.fill();
      }

      renderRunway();

      for (const p of state.planes) {
        drawPlane(p);
      }
    }

    function gameLoop(timestamp) {
      const dt = Math.min(0.033, (timestamp - lastTime) / 1000 || 0.016);
      lastTime = timestamp;

      if (gameStarted) {
        spawnPlanes(dt);
        updatePlanes(dt);
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    function handlePointer(event) {
      if (!gameStarted) return;

      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      let hit = null;
      for (const plane of state.planes) {
        const dx = x - plane.x;
        const dy = y - plane.y;
        if (Math.abs(dx) < 30 && Math.abs(dy) < 18) {
          hit = plane;
          break;
        }
      }

      if (hit) {
        state.planes.forEach(p => p.selected = false);
        hit.selected = true;
      }
    }

    canvas.addEventListener("pointerdown", handlePointer);
    window.addEventListener("pointerdown", (e) => {
      if (gameStarted && e.target.nodeName !== "BUTTON") {
        handlePointer(e);
      }
    });

    startBtn.addEventListener("click", () => {
      gameStarted = true;
      startOverlay.classList.add("hidden");
      resetGame();
    });

    window.addEventListener("resize", resize);
    resize();
    updateHud();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
